openapi: 3.1.0
info:
  title: Grave Site GPTs Actions API
  description: ChatGPT Custom GPTs Actions から Cloud Run 経由で家族向けメッセージを保存する API。
  version: 0.2.0
paths:
  /actions/save-message:
    post:
      summary: Save Message
      operationId: saveMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveMessageRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveMessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
  /messages/{record_id}:
    get:
      summary: Get Message
      operationId: getMessage
      security:
      - ApiKeyAuth: []
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^msg-[0-9a-f]{32}(?:[0-9a-f]{32})?$
          title: Record Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
    put:
      summary: Update Message
      operationId: updateMessage
      security:
      - ApiKeyAuth: []
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^msg-[0-9a-f]{32}(?:[0-9a-f]{32})?$
          title: Record Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveMessageResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
  /messages/{record_id}/retry:
    post:
      summary: Retry Message
      operationId: retryMessage
      security:
      - ApiKeyAuth: []
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^msg-[0-9a-f]{32}(?:[0-9a-f]{32})?$
          title: Record Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveMessageResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
components:
  schemas:
    ErrorResponse:
      properties:
        error:
          type: string
          title: Error
        message:
          type: string
          title: Message
      type: object
      required:
      - error
      - message
      title: ErrorResponse
    MessageContent:
      properties:
        recipient:
          type: string
          maxLength: 200
          minLength: 1
          title: Recipient
        message:
          type: string
          maxLength: 1000
          minLength: 1
          title: Message
        date:
          type: string
          format: date
          title: Date
        tags:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 100
          title: Tags
        source:
          type: string
          maxLength: 100
          minLength: 1
          title: Source
          default: gpts-actions
        calendar_id:
          anyOf:
          - type: string
            maxLength: 500
            minLength: 1
          - type: 'null'
          title: Calendar Id
        publish_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Publish At
          description: Earliest Calendar publication time; explicit timezone required.
        memory_refs:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 100
          title: Memory Refs
          description: Provenance references only; no automatic retrieval.
      additionalProperties: false
      type: object
      required:
      - recipient
      - message
      - date
      title: MessageContent
    MessageResponse:
      properties:
        saved:
          type: boolean
          title: Saved
        storage_type:
          type: string
          const: record
          title: Storage Type
        record_id:
          type: string
          title: Record Id
        revision:
          type: integer
          title: Revision
        storage_status:
          type: string
          const: saved
          title: Storage Status
        drive_status:
          type: string
          enum:
          - pending
          - saved
          - failed
          - unknown
          - disabled
          title: Drive Status
        delivery_status:
          type: string
          enum:
          - pending
          - published
          - failed
          - unknown
          - disabled
          title: Delivery Status
        drive_file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Drive File Id
        calendar_event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Calendar Event Id
        drive_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Drive Error
        delivery_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Error
        processing:
          type: boolean
          title: Processing
        content:
          $ref: '#/components/schemas/MessageContent'
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      required:
      - saved
      - storage_type
      - record_id
      - revision
      - storage_status
      - drive_status
      - delivery_status
      - drive_file_id
      - calendar_event_id
      - drive_error
      - delivery_error
      - processing
      - content
      - request_id
      title: MessageResponse
    SaveMessageRequest:
      properties:
        recipient:
          type: string
          maxLength: 200
          minLength: 1
          title: Recipient
        message:
          type: string
          maxLength: 1000
          minLength: 1
          title: Message
        date:
          type: string
          format: date
          title: Date
        tags:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 100
          title: Tags
        source:
          type: string
          maxLength: 100
          minLength: 1
          title: Source
          default: gpts-actions
        calendar_id:
          anyOf:
          - type: string
            maxLength: 500
            minLength: 1
          - type: 'null'
          title: Calendar Id
        publish_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Publish At
          description: Earliest Calendar publication time; explicit timezone required.
        memory_refs:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 100
          title: Memory Refs
          description: Provenance references only; no automatic retrieval.
        request_id:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Request Id
          description: Persist and reuse this key when retrying a request.
      additionalProperties: false
      type: object
      required:
      - recipient
      - message
      - date
      title: SaveMessageRequest
    SaveMessageResponse:
      properties:
        saved:
          type: boolean
          title: Saved
        storage_type:
          type: string
          const: record
          title: Storage Type
        record_id:
          type: string
          title: Record Id
        revision:
          type: integer
          title: Revision
        storage_status:
          type: string
          const: saved
          title: Storage Status
        drive_status:
          type: string
          enum:
          - pending
          - saved
          - failed
          - unknown
          - disabled
          title: Drive Status
        delivery_status:
          type: string
          enum:
          - pending
          - published
          - failed
          - unknown
          - disabled
          title: Delivery Status
        drive_file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Drive File Id
        calendar_event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Calendar Event Id
        drive_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Drive Error
        delivery_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Error
        processing:
          type: boolean
          title: Processing
      type: object
      required:
      - saved
      - storage_type
      - record_id
      - revision
      - storage_status
      - drive_status
      - delivery_status
      - drive_file_id
      - calendar_event_id
      - drive_error
      - delivery_error
      - processing
      title: SaveMessageResponse
    UpdateMessageRequest:
      properties:
        recipient:
          type: string
          maxLength: 200
          minLength: 1
          title: Recipient
        message:
          type: string
          maxLength: 1000
          minLength: 1
          title: Message
        date:
          type: string
          format: date
          title: Date
        tags:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 100
          title: Tags
        source:
          type: string
          maxLength: 100
          minLength: 1
          title: Source
          default: gpts-actions
        calendar_id:
          anyOf:
          - type: string
            maxLength: 500
            minLength: 1
          - type: 'null'
          title: Calendar Id
        publish_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Publish At
          description: Earliest Calendar publication time; explicit timezone required.
        memory_refs:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 100
          title: Memory Refs
          description: Provenance references only; no automatic retrieval.
        expected_revision:
          type: integer
          minimum: 1.0
          title: Expected Revision
      additionalProperties: false
      type: object
      required:
      - recipient
      - message
      - date
      - expected_revision
      title: UpdateMessageRequest
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
servers:
- url: https://replace-with-your-api.example.invalid
