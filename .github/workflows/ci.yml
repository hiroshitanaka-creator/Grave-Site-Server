name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: python -m pip install -c requirements.lock -e ".[dev,google,cloud]"
      - name: Lint
        run: ruff check .
      - name: Unit, contract and simulated integration tests
        run: python -m pytest -o addopts='' -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Installed wheel outside source tree
        shell: bash
        run: |
          python -m venv /tmp/grave-wheel-test
          /tmp/grave-wheel-test/bin/python -m pip install -c requirements.lock dist/*.whl
          /tmp/grave-wheel-test/bin/python -I scripts/smoke_installed.py
